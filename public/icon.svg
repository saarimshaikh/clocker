<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background with dark glassmorphic gradient -->
  <rect width="512" height="512" rx="120" fill="url(#grad)" />
  
  <!-- Clock face -->
  <circle cx="256" cy="256" r="160" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="16" />
  
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="white" stroke-width="24" stroke-linecap="round" />
  
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="330" y2="256" stroke="white" stroke-width="16" stroke-linecap="round" />
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="24" fill="#3b82f6" />

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
</svg>
